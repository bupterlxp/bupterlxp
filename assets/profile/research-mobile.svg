  <text x="62" y="135" font-size="20" fill="#cad8d0">SWE-Compass / WebCompass</text>
  <text x="62" y="185" font-size="20" fill="#cad8d0">CodeTracer / Solvita</text>
  <path d="M 40 238 V 354" stroke="#ff6f91" stroke-width="1.5" opacity="0.3" />
  <rect x="-3" y="-3" width="6" height="6" fill="#ff6f91" filter="url(#glow)">
    <animateMotion path="M 40 238 V 354" dur="4s" begin="0s" repeatCount="indefinite" />
  </rect>
