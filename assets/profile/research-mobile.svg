  <rect x="0.0" y="0" width="105.0" height="3" fill="#39e5dc" />
  <rect x="105.0" y="0" width="105.0" height="3" fill="#ff6f91" />
  <rect x="210.0" y="0" width="105.0" height="3" fill="#c4f279" />
  <rect x="315.0" y="0" width="105.0" height="3" fill="#ffc477" />
  <path d="M 0 641 H 420" stroke="#31463a" />
  <text x="26" y="43" font-size="20" fill="#39e5dc" font-family="'Courier New', monospace">RESEARCH CONSTELLATION</text>
