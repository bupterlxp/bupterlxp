  <text x="62" y="365" font-size="23" fill="#c4f279" font-weight="bold">Reasoning + alignment</text>
  <text x="62" y="399" font-size="20" fill="#cad8d0">HiPO / Inverse IFEval</text>
  <text x="62" y="449" font-size="20" fill="#cad8d0">KAT-Coder</text>
  <rect x="34" y="487" width="12" height="12" fill="#ffc477" />
  <text x="62" y="497" font-size="23" fill="#ffc477" font-weight="bold">Scientific ideation</text>
  <text x="62" y="531" font-size="20" fill="#cad8d0">MotivGraph-SoIQ</text>
