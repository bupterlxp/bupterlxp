<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 642" width="420" height="642" fill="none" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" letter-spacing="0">
  <title id="title">Research Constellation</title>
  <desc id="description">Four connected research directions: agentic coding, multi-agent systems, reasoning and alignment, and scientific ideation.</desc>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 H 0 V 32" stroke="#26342f" stroke-width="0.7" />
    </pattern>
  </defs>
  <rect width="420" height="642" fill="#090e0c" />
