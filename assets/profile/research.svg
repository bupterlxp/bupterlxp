<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 458" width="1120" height="458" fill="none" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" letter-spacing="0">
  <title id="title">Research Constellation</title>
  <desc id="description">Four connected research directions: agentic coding, multi-agent systems, reasoning and alignment, and scientific ideation.</desc>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 H 0 V 32" stroke="#26342f" stroke-width="0.7" />
    </pattern>
  </defs>
  <rect width="1120" height="458" fill="#090e0c" />
  <rect width="1120" height="458" fill="url(#grid)" opacity="0.42" />
  <rect x="0.0" y="0" width="280.0" height="3" fill="#39e5dc" />
  <rect x="280.0" y="0" width="280.0" height="3" fill="#ff6f91" />
  <rect x="560.0" y="0" width="280.0" height="3" fill="#c4f279" />
  <rect x="840.0" y="0" width="280.0" height="3" fill="#ffc477" />
  <path d="M 0 457 H 1120" stroke="#31463a" />
  <text x="32" y="43" font-size="20" fill="#39e5dc" font-family="'Courier New', monospace">RESEARCH CONSTELLATION</text>
  <path d="M 560 230 H 388 V 118 H 362" stroke="#39e5dc" stroke-width="1.5" opacity="0.3" />
  <rect x="-3" y="-3" width="6" height="6" fill="#39e5dc" filter="url(#glow)">
    <animateMotion path="M 560 230 H 388 V 118 H 362" dur="4s" begin="-0s" repeatCount="indefinite" />
  </rect>
  <text x="40" y="125" font-size="26" fill="#39e5dc" font-weight="bold">Agentic coding</text>
  <text x="40" y="161" font-size="22" fill="#cad8d0">SWE-Compass / WebCompass</text>
  <text x="40" y="190" font-size="22" fill="#cad8d0">CodeTracer / Solvita</text>
  <path d="M 560 230 H 720 V 118 H 730" stroke="#ff6f91" stroke-width="1.5" opacity="0.3" />
  <rect x="-3" y="-3" width="6" height="6" fill="#ff6f91" filter="url(#glow)">
    <animateMotion path="M 560 230 H 720 V 118 H 730" dur="5s" begin="-1s" repeatCount="indefinite" />
  </rect>
  <text x="750" y="125" font-size="26" fill="#ff6f91" font-weight="bold">Multi-agent systems</text>
  <text x="750" y="161" font-size="22" fill="#cad8d0">AutoMV / Vibe AIGC</text>
  <path d="M 560 230 H 388 V 315 H 362" stroke="#c4f279" stroke-width="1.5" opacity="0.3" />
  <rect x="-3" y="-3" width="6" height="6" fill="#c4f279" filter="url(#glow)">
    <animateMotion path="M 560 230 H 388 V 315 H 362" dur="6s" begin="-2s" repeatCount="indefinite" />
  </rect>
  <text x="40" y="322" font-size="26" fill="#c4f279" font-weight="bold">Reasoning + alignment</text>
  <text x="40" y="358" font-size="22" fill="#cad8d0">HiPO / Inverse IFEval</text>
  <text x="40" y="387" font-size="22" fill="#cad8d0">KAT-Coder</text>
  <path d="M 560 230 H 720 V 315 H 730" stroke="#ffc477" stroke-width="1.5" opacity="0.3" />
  <rect x="-3" y="-3" width="6" height="6" fill="#ffc477" filter="url(#glow)">
    <animateMotion path="M 560 230 H 720 V 315 H 730" dur="7s" begin="-3s" repeatCount="indefinite" />
  </rect>
  <text x="750" y="322" font-size="26" fill="#ffc477" font-weight="bold">Scientific ideation</text>
  <text x="750" y="358" font-size="22" fill="#cad8d0">MotivGraph-SoIQ / MMG2Skill</text>
  <path d="M 560 168 L 622 230 L 560 292 L 498 230 Z" fill="#101b14" stroke="#39e5dc" stroke-width="2" />
  <path d="M 560 156 L 634 230 L 560 304 L 486 230 Z" stroke="#ff6f91" stroke-width="2" stroke-dasharray="16 20" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-144" dur="12s" repeatCount="indefinite" />
  </path>
  <text x="560" y="225" font-size="27" fill="#eaf3ef" font-weight="bold" text-anchor="middle">LEI</text>
  <text x="560" y="251" font-size="19" fill="#39e5dc" text-anchor="middle">LAB</text>
  <text x="1088" y="432" font-size="17" fill="#a6b7af" text-anchor="end" font-family="'Courier New', monospace">questions &gt; experiments &gt; evidence</text>
</svg>